<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripReady</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f7;
        --surface: #ffffff;
        --text: #16161a;
        --muted: #8a8a8f;
        --primary: #6c4ee3;
        --border: #ececef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0 20px 64px;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      header {
        padding: 32px 0 8px;
      }
      header a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
      main {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 18px;
        margin: 32px 0 0;
      }
      h3 {
        font-size: 16px;
        margin: 24px 0 0;
      }
      p,
      ul {
        margin: 12px 0 0;
      }
      ul {
        padding-left: 20px;
      }
      li {
        margin-top: 8px;
      }
      a {
        color: var(--primary);
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 24px;
      }
      .footer {
        color: var(--muted);
        font-size: 14px;
        margin-top: 40px;
      }
      .links {
        list-style: none;
        padding: 0;
      }
      .links li {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #121214;
          --surface: #1c1c1f;
          --text: #f2f2f4;
          --muted: #9a9aa0;
          --border: #2a2a2f;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header></header>
      <main>
        <h1>TripReady</h1>
        <p class="meta">Tudo o que você precisa antes de viajar, organizado em um só lugar.</p>
        <ul class="links">
          <li><a href="/privacidade.html">Política de Privacidade</a></li>
          <li><a href="/termos.html">Termos de Uso</a></li>
          <li><a href="/suporte.html">Suporte</a></li>
          <li><a href="/exclusao-de-conta.html">Excluir minha conta</a></li>
        </ul>
      </main>
    </div>
  </body>
</html>
